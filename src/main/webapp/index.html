<!DOCTYPE html>
<html>

<head>
    <title>ATM Management System</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-page">

        <!-- Left Side -->
        <div class="login-info">

            <div class="atm-logo">🏧</div>

            <h1>ATM MANAGEMENT</h1>

            <h2>Secure Banking</h2>

            <p>
                Welcome to our secure ATM Management System.
                Manage your banking transactions quickly and safely.
            </p>

            <div class="features">
                <span>✓ Secure Login</span>
                <span>✓ Fast Transactions</span>
                <span>✓ Easy Banking</span>
            </div>

        </div>


        <!-- Right Side -->
        <div class="login-box">

            <h2>Welcome Back</h2>

            <p class="login-subtitle">
                Login to access your ATM account
            </p>

            <form action="login" method="post">

                <label>Account Number</label>

                <div class="input-box">
                    <span>👤</span>
                    <input type="text"
                           name="accountNo"
                           placeholder="Enter account number"
                           required>
                </div>


                <label>PIN</label>

                <div class="input-box">
                    <span>🔒</span>
                    <input type="password"
                           name="pin"
                           placeholder="Enter your PIN"
                           required>
                </div>


                <button type="submit" class="login-btn">
                    LOGIN
                </button>

            </form>

            <p class="secure-text">
                🔐 Your banking information is secure
            </p>

        </div>

    </div>

</body>

</html>
