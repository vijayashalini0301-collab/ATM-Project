<!DOCTYPE html>
<html>
<head>
    <title>Change PIN</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="atm-container">

        <div class="atm-card">

            <h2>ATM MANAGEMENT SYSTEM</h2>
            <h3>Change PIN</h3>

            <form action="changepin" method="post">

                <label>Enter New PIN</label>

                <input type="password"
                       name="newpin"
                       placeholder="Enter New PIN"
                       maxlength="10"
                       required>

                <button type="submit">Change PIN</button>

            </form>

            <a href="home.html">← Back to ATM Menu</a>

        </div>

    </div>

</body>
</html>
